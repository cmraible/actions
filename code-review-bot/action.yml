name: Code Review Bot
description: Automatically review pull requests and post findings as PR review comments using opencode.
inputs:
  model:
    description: Model to use with opencode (for example, openai/gpt-5.3-codex).
    required: true
  openai_api_key:
    description: API key passed to opencode as OPENAI_API_KEY.
    required: true
  agent:
    description: Agent to use. Falls back to opencode defaults when omitted.
    required: false
  share:
    description: Share the opencode session (defaults to opencode behavior when omitted).
    required: false
  use_github_token:
    description: Use GITHUB_TOKEN instead of an opencode app token.
    required: false
    default: "false"
  mentions:
    description: Comma-separated trigger phrases. Leave empty to disable mention filtering.
    required: false
    default: ""
  oidc_base_url:
    description: Base URL for OIDC token exchange API.
    required: false
  review_prompt:
    description: Override the default prompt used when a pull request triggers the bot.
    required: false
runs:
  using: composite
  steps:
    - name: Configure Code Review Bot prompt
      id: prompt
      shell: bash
      env:
        REVIEW_PROMPT_INPUT: ${{ inputs.review_prompt }}
        EVENT_NAME: ${{ github.event_name }}
        EVENT_ACTION: ${{ github.event.action }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO_OWNER: ${{ github.repository_owner }}
        REPO_NAME: ${{ github.event.repository.name }}
      run: |
        set -euo pipefail

        STATUS="skip"
        PROMPT_CONTENT=""

        if [ "$EVENT_NAME" = "pull_request" ] && \
           { [ "$EVENT_ACTION" = "opened" ] || [ "$EVENT_ACTION" = "synchronize" ] || [ "$EVENT_ACTION" = "reopened" ]; }; then
          STATUS="review"
          PROMPT_CONTENT="${REVIEW_PROMPT_INPUT:-}"

          if [ -z "$PROMPT_CONTENT" ]; then
            PROMPT_CONTENT="$(printf '%s\n' \
              'You are Code Review Bot. A pull request has been opened or updated.' \
              '- Check out the pull request branch locally and examine the changed files.' \
              '- Review the code for correctness, security issues, style problems, and potential bugs.' \
              '- Post your findings as a pull request review using inline comments on the relevant lines where possible.' \
              '- Summarize your overall assessment in the review body.' \
              '- Be constructive and specific; reference exact lines or functions when noting an issue.')"
          fi
        else
          echo "status=skip" >> "$GITHUB_OUTPUT"
          echo "prompt=" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        {
          echo "prompt<<EOP"
          echo "$PROMPT_CONTENT"
          echo "EOP"
        } >> "$GITHUB_OUTPUT"

        echo "status=$STATUS" >> "$GITHUB_OUTPUT"

        # Build a synthetic issue_comment event so the opencode binary uses its
        # comment-mode code path, where the TOKEN env var skips the collaborator
        # permission check (which fails for bot actors like Copilot).
        MOCK_EVENT=$(jq -cn \
          --arg owner "$REPO_OWNER" \
          --arg repo  "$REPO_NAME" \
          --argjson number "$PR_NUMBER" \
          '{"eventName":"issue_comment","repo":{"owner":$owner,"repo":$repo},"actor":$owner,"payload":{"issue":{"number":$number,"pull_request":{}},"comment":{"id":0,"body":"/opencode review"}}}')
        echo "mock_event=$MOCK_EVENT" >> "$GITHUB_OUTPUT"

    - name: Run opencode
      if: steps.prompt.outputs.status != 'skip'
      uses: anomalyco/opencode/github@latest
      with:
        model: ${{ inputs.model }}
        agent: ${{ inputs.agent }}
        share: ${{ inputs.share }}
        prompt: ${{ steps.prompt.outputs.prompt }}
        use_github_token: ${{ inputs.use_github_token }}
        mentions: ${{ inputs.mentions }}
        oidc_base_url: ${{ inputs.oidc_base_url }}
      env:
        OPENAI_API_KEY: ${{ inputs.openai_api_key }}
        GITHUB_TOKEN: ${{ github.token }}
        TOKEN: ${{ github.token }}
        MOCK_EVENT: ${{ steps.prompt.outputs.mock_event }}
