name: Hello World
description: Simple reusable greeting action.
inputs:
  name:
    description: Name to greet.
    required: false
    default: World
outputs:
  greeting:
    description: The generated greeting message.
    value: ${{ steps.greet.outputs.greeting }}
runs:
  using: composite
  steps:
    - name: Generate greeting
      id: greet
      shell: bash
      env:
        INPUT_NAME: ${{ inputs.name }}
      run: |
        GREETING="Hello, ${INPUT_NAME:-World}!"
        echo "greeting=$GREETING" >> "$GITHUB_OUTPUT"
        echo "$GREETING"
branding:
  color: yellow
  icon: smile
